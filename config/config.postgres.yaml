logging:
  level: info

# Client IP resolution. The default (envoySource only) uses the address of the peer
# connected to Envoy. config/envoy.yaml sets use_remote_address: true, so Envoy computes
# the client address and stores it in x-envoy-external-address; read that header first.
clientIp:
  sources:
    - header: x-envoy-external-address
    - envoySource

authorizationPolicy: "trusted"

analysisControllers:
  - name: asn-detect
    type: maxmind-asn
    settings:
      databasePath: GeoLite2-ASN.mmdb
  - name: geoip-detect
    type: maxmind-geoip
    settings:
      databasePath: GeoLite2-City.mmdb

matchControllers:
  - name: trusted
    type: ip-match-database
    settings:
      cache:
        ttl: 5m
      database:
        type: postgres
        postgres:
          query: "SELECT 1 FROM trusted_ips WHERE ip = $1 LIMIT 1"
          host: localhost
          port: 5432
          databaseName: security
          # Expanded from the environment; the defaults match docker-compose.yaml
          username: ${POSTGRES_USER:-postgres}
          password: ${POSTGRES_PASSWORD:-postgres}

