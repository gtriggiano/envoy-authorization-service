logging:
  level: debug

# Client IP resolution. The default (envoySource only) uses the address of the peer
# connected to Envoy. config/envoy.yaml sets use_remote_address: true, so Envoy computes
# the client address and stores it in x-envoy-external-address; read that header first.
clientIp:
  sources:
    - header: x-envoy-external-address
    - envoySource

authorizationPolicy: "trusted || !scraper"

analysisControllers:
  - name: asn-detect
    type: maxmind-asn
    settings:
      databasePath: GeoLite2-ASN.mmdb
  - name: geoip-detect
    type: maxmind-geoip
    settings:
      databasePath: GeoLite2-City.mmdb

matchControllers:
  - name: trusted
    type: ip-match
    settings:
      cidrList: whitelisted-cidrs.txt

  - name: scraper
    type: ip-match
    settings:
      cidrList: scrapers-cidrs.txt
