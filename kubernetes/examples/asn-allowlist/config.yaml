logging:
  level: info

shutdown:
  timeout: 25s

server:
  address: ":9001"

metrics:
  address: ":9090"

# Client IP resolution (default: the peer connected to Envoy, request headers ignored).
# Behind a load balancer, configure Envoy with use_remote_address: true and read the
# address Envoy computed. See docs/guides/client-ip.md.
# clientIp:
#   sources:
#     - header: x-envoy-external-address
#     - envoySource

analysisControllers:
  - name: asn-detect
    type: maxmind-asn
    settings:
      databasePath: /maxmind/GeoLite2-ASN.mmdb

matchControllers:
  - name: allowed-asn
    type: asn-match
    settings:
      asnList: /config/allowed-asns.txt

# Allow only requests whose client ASN is in the allowlist
authorizationPolicy: allowed-asn
authorizationPolicyBypass: false
