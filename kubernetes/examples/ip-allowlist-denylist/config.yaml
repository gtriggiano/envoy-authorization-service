logging:
  level: info

shutdown:
  timeout: 25s

server:
  address: ":9001"

metrics:
  address: ":9090"

# Client IP resolution (default: the peer connected to Envoy, request headers ignored).
# Behind a load balancer, configure Envoy with use_remote_address: true and read the
# address Envoy computed. See docs/guides/client-ip.md.
# clientIp:
#   sources:
#     - header: x-envoy-external-address
#     - envoySource

matchControllers:
  - name: allowed-ips
    type: ip-match
    settings:
      cidrList: /config/allowed-ips.txt
  - name: blocked-ips
    type: ip-match
    settings:
      cidrList: /config/blocked-ips.txt

# Allow only IPs in the allowlist that are NOT in the blocklist
authorizationPolicy: "allowed-ips && !blocked-ips"
authorizationPolicyBypass: false
